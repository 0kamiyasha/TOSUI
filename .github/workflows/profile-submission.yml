name: Profile string submission

on:
  issues:
    types: [opened, edited, labeled]

# Filing a labeled issue form fires both `opened` and `labeled`. Without this,
# two jobs race to push profile/issue-N and the loser comments failure.
concurrency:
  group: profile-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    if: >-
      github.event.issue.state == 'open'
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'profile-submission')
        || (github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'profile-submission'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$ISSUE_BODY" > /tmp/issue-body.md

      - name: Apply string to TOSUI_Data
        id: apply
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_profile_string.py \
            --body-file /tmp/issue-body.md \
            --summary-file /tmp/summary.json
          FILE=$(python3 -c 'import json; print(json.load(open("/tmp/summary.json"))["file"])')
          KEY=$(python3 -c 'import json; print(json.load(open("/tmp/summary.json"))["key"])')
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: update ${{ steps.apply.outputs.key }} from #${{ github.event.issue.number }}"
          branch: profile/issue-${{ github.event.issue.number }}
          delete-branch: true
          title: "data: update ${{ steps.apply.outputs.key }} (#${{ github.event.issue.number }})"
          body: |
            Auto-generated from profile submission #${{ github.event.issue.number }} by @${{ github.event.issue.user.login }}.

            - File: `${{ steps.apply.outputs.file }}`
            - Key: `D.${{ steps.apply.outputs.key }}`

            After merge, publish to CurseForge by tagging a release, for example:
            `git tag v20260812.01 && git push origin v20260812.01`

            Closes #${{ github.event.issue.number }}
          add-paths: |
            TOSUI_Data/**

      - name: Comment on issue
        if: steps.cpr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.cpr.outputs.pull-request-url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Opened pull request for this submission: ${url}`
            });

      - name: Comment when already packaged
        if: success() && steps.cpr.outputs.pull-request-url == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Parsed this submission, but `TOSUI_Data` already has the same `D.${{ steps.apply.outputs.key }}` string. No pull request was opened.'
            });

      - name: Comment on failure
        if: failure() && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Could not auto-create a PR from this submission. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) logs.'
            });
